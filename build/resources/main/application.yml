spring:
  application:
    name: tissugest-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5434/tissugest?stringtype=unspecified
    username: tissugest
    password: tissugest_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
app:
  jwt:
    secret: tissugest-dev-secret-key-minimum-256-bits-long-for-hs256-algorithm-security
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days

  # Subscription grace period
  subscription:
    grace-period-days: 3
    trial-duration-days: 14

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Logging
logging:
  level:
    com.tissugest: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /docs/api
  swagger-ui:
    path: /docs/swagger
