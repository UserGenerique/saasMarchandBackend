services:
  postgres:
    image: postgres:16-alpine
    container_name: tissugest-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tissugest}
      POSTGRES_USER: ${DB_USER:-tissugest}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tissugest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tissugest-redis
    restart: always
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tissugest-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tissugest}?stringtype=unspecified
      DB_USER: ${DB_USER:-tissugest}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - uploads:/app/uploads

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: tissugest-admin
    restart: always

  nginx:
    image: nginx:alpine
    container_name: tissugest-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - admin
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
  uploads:
